# BoT-SORT mit Wiedererkennung: nimmt zusaetzlich das Aussehen dazu,
# damit eine Spur eine Verdeckung uebersteht statt eine neue Nummer zu bekommen
tracker_type: botsort
track_high_thresh: 0.40
track_low_thresh: 0.08
new_track_thresh: 0.55
track_buffer: 90
match_thresh: 0.85
fuse_score: true
gmc_method: none          # Kamera steht fest, Bildbewegung muss nicht geschaetzt werden
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: true
model: auto
